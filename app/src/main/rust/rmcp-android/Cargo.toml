[package]
name = "rikkahub_rmcp"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
http = "1"
jni = "0.21"
once_cell = "1"
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
