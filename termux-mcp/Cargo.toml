[package]
name = "rikkahub-shell-mcp"
version = "0.1.0"
edition = "2021"
description = "A small Streamable HTTP MCP server for interactive Termux shell sessions"
license = "AGPL-3.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["json"] }
clap = { version = "4.5", features = ["derive", "env"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
