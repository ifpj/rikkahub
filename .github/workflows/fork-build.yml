name: Fork Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute fork version
        id: version
        run: |
          # 添加上游 remote 并获取 tags
          git remote add upstream https://github.com/rikkahub/rikkahub.git || true
          git fetch upstream --tags --quiet

          # 从上游 master 的 build.gradle.kts 中提取版本号和 versionCode
          UPSTREAM_VERSION=$(git show upstream/master:app/build.gradle.kts | grep -oP 'versionName\s*=\s*"\K[^"]+')
          echo "upstream_version=$UPSTREAM_VERSION"
          UPSTREAM_VC=$(git show upstream/master:app/build.gradle.kts | grep -oP 'versionCode\s*=\s*\K[0-9]+')
          echo "upstream_version_code=$UPSTREAM_VC"

          # 找到上游版本号对应的 tag commit
          if git rev-parse "$UPSTREAM_VERSION" >/dev/null 2>&1; then
            BASE_REF="$UPSTREAM_VERSION"
          else
            # tag 不存在则用 upstream/master
            BASE_REF="upstream/master"
          fi

          # 计算 fork 领先的提交数
          AHEAD=$(git rev-list --count "$BASE_REF"..HEAD)
          echo "ahead=$AHEAD"

          # fork 用户名
          FORK_USER="${{ github.repository_owner }}"

          # 组合版本号: 上游版本-用户名-领先数
          FORK_VERSION="${UPSTREAM_VERSION}-${FORK_USER}-${AHEAD}"
          echo "fork_version=$FORK_VERSION" >> "$GITHUB_OUTPUT"

          # 计算 fork versionCode: upstreamVC * 10000 + ahead 提交数
          FORK_VC=$((UPSTREAM_VC * 10000 + AHEAD))
          echo "fork_version_code=$FORK_VC" >> "$GITHUB_OUTPUT"

          echo "Fork version: $FORK_VERSION (versionCode: $FORK_VC)"

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare build files
        run: |
          # 签名配置（缺失则用 debug 签名）
          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
            # file() 在 app/build.gradle.kts 中相对于 app/ 目录解析
            # keystore 放在 app/app.key，所以 storeFile 应为 app.key
            sed -i 's|^storeFile=.*|storeFile=app.key|' local.properties
          fi

      - name: Override versionName and versionCode
        run: |
          FORK_VERSION="${{ steps.version.outputs.fork_version }}"
          FORK_VC="${{ steps.version.outputs.fork_version_code }}"
          sed -i "s/versionName = \".*\"/versionName = \"$FORK_VERSION\"/" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = $FORK_VC/" app/build.gradle.kts

      - name: Disable R8 and resource shrinking for CI speed
        run: |
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' app/build.gradle.kts
          sed -i 's/isShrinkResources = true/isShrinkResources = false/' app/build.gradle.kts

      - name: Fallback to debug signing if no secrets
        if: env.HAS_SIGNING == ''
        env:
          HAS_SIGNING: ${{ secrets.KEY_BASE64 }}
        run: |
          # 没有签名配置时，release 构建使用 debug 签名
          sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/' app/build.gradle.kts

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --parallel --build-cache \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x lintVitalRelease

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        if: success()
        with:
          tag_name: ${{ steps.version.outputs.fork_version }}
          name: ${{ steps.version.outputs.fork_version }}
          prerelease: false
          make_latest: true
          body: |
            Fork 自动构建

            - 上游仓库: [rikkahub/rikkahub](https://github.com/rikkahub/rikkahub)
            - 版本号: `${{ steps.version.outputs.fork_version }}`
            - 构建分支: `${{ github.ref_name }}`
            - 构建 commit: `${{ github.sha }}`
          files: app/build/outputs/apk/release/*.apk
